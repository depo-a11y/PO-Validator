# Shape of the secrets the "Order confirmation to PO" page reads. Every value here is FAKE.
# Locally: copy to .streamlit/secrets.toml (gitignored). On Streamlit Community Cloud: paste
# the real version into the app's Settings > Secrets box. Never commit real values.

# The AI order-confirmation reader (oc/adapters/ai.py) sends the OC PDF to the Anthropic API with this
# key. Without it, an AI read is a FAIL that says to ask Colwyn. Top level, not inside a table.
ANTHROPIC_API_KEY = "sk-ant-FAKE-not-a-real-key"

# Who may use the brands saved below: whole sign-in email addresses, case does not matter.
# With no oc_viewers, saved brands are never listed (the page still takes an uploaded .yaml).
oc_viewers = ["buyer@example.com"]

# One entry per brand. The value is the brand's .yaml config pasted whole as a TOML
# multi-line string, so the same text works as a file and as a secret. The history
# paths in it are never opened here (only a config file on the computer running the
# app is trusted with paths): upload the past POs on the page instead. Their file
# names are still used to label the uploads with the right season.
[oc_brands]
examplebrand = """
vendor: EXAMPLE BRAND
adapter: otb
oc_label: EX
season: S/S 27
sku_prefix: EXSS27
cost_currency: EUR
cost_multiplier: 1.0
margin_floor: 2.5
history:
  - {label: F/W 26, path: Example_FW26_PO.xlsx}
product_class_types:
  SNEAKERS: SHOES SNEAKERS
colour_families:
  BLACK: [black]
"""

# A TOML table works too, with the same keys:
# [oc_brands.otherbrand]
# vendor = "OTHER BRAND"
# adapter = "otb"
# oc_label = "EX"
# season = "S/S 27"
# sku_prefix = "OBSS27"
# cost_currency = "EUR"
# cost_multiplier = 1.0
# margin_floor = 2.5

# Sign-in. Streamlit only knows a viewer's email when the app signs them in itself
# (st.login). Since Streamlit 1.42, Community Cloud no longer hands the app the email of
# a viewer signed in to Community Cloud, so without this section nobody passes the
# oc_viewers check. Needs the Authlib package (Authlib>=1.3.2, installed by requirements.txt).
# Example for Google:
# [auth]
# redirect_uri = "https://your-app.streamlit.app/oauth2callback"
# cookie_secret = "a-long-random-string"
# client_id = "fake-id.apps.googleusercontent.com"
# client_secret = "fake-secret"
# server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
