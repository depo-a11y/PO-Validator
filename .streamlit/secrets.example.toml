# Shape of the secrets the "Order confirmation to PO" page reads. Values here are FAKE.
# Locally: copy to .streamlit/secrets.toml (gitignored). On Streamlit Community Cloud:
# paste the real version into the app's Settings > Secrets box. Never commit real values.
#
# One entry per brand under [oc_brands]. The value is the brand's .yaml config pasted
# whole as a TOML multi-line string, so the same text works as a file and as a secret.

[oc_brands]
examplebrand = """
vendor: EXAMPLE BRAND
adapter: otb
season: S/S 27
sku_prefix: EXSS27
cost_currency: EUR
cost_multiplier: 1.0
margin_floor: 2.5
history:
  - {label: F/W 26, path: ~/path/to/Example_FW26_PO.xlsx}
product_class_types:
  SNEAKERS: SHOES SNEAKERS
colour_families:
  BLACK: [black]
"""

# A TOML table works too, with the same keys:
# [oc_brands.otherbrand]
# vendor = "OTHER BRAND"
# adapter = "otb"
# season = "S/S 27"
# sku_prefix = "OBSS27"
# cost_currency = "EUR"
# cost_multiplier = 1.0
# margin_floor = 2.5
