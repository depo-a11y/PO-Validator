# Shape of a brand config. Copy to <brand>.local.yaml and fill in real values.
# *.local.yaml is gitignored: cost multipliers, history paths and price data are
# commercial and must never be committed while this repo is public.
# A top-level key not shown here fails the load, naming it.
vendor: EXAMPLE BRAND          # exactly as in validator_core.APPROVED_VENDORS
adapter: otb                   # OC reader. Built-in, one layout each: otb (Maison Margiela/MM6), admilano (AD
                               # Milano), adidas (adidas AG), fog (Fear of God), thugclub (THUG CLUB Corp.
                               # proforma invoices; needs oc_label), joor (the JOOR order print of any brand;
                               # needs oc_supplier, the brand contact's email domain), p3m (the "#3xxxxxx" ordering
                               # platform; needs oc_supplier, the selling company), sportlux (the Palm Angels
                               # distributor's Order Confirmation PDFs; needs oc_supplier). sheet: an OC sent as a
                               # spreadsheet, read by a sheet: column mapping (oc/adapters/sheet.py) and join_key.
                               # Or ai: any layout, read by Claude; needs oc_supplier and join_key below, and
                               # ANTHROPIC_API_KEY in the app's secrets. With no OC yet, `draft --cart` reads the
                               # OTB selling-session cart as the order, UNCONFIRMED, with this same config
# sheet:                       # sheet only: printed header per field, e.g. columns: {style: Style, qty: Units, ...},
#   ean_prefixes: ["0000000"]  # the brand's GS1 company prefixes, checked against every EAN (its identity anchor);
#   totals: none               # or a totals row / cells; none when the brand prints none (oc/adapters/sheet.py)
#   select: {column: Customer PO, values: [AA], known: [AA, AB]}   # only these rows are this brand's; a row
                               # whose value is in no brand's config (known) FAILs
#   header_rows: 2             # stack_headers: true joins a header printed over the two rows
#   price_from: line_value     # no unit price printed: line value / qty per size row
#   columns: {qty_gross: Gross, qty_cancelled: Cancelled}   # gross - cancelled must equal qty on every row
# oc_style_prefix: [ZZ]        # any reader: every OC line's style must start with one (a brand sharing an
                               # agency's issuer); counts as an identity check
# match_ignore: "-_ "          # any reader: these separators are left out of both codes, upper-cased, when an
                               # OC code is matched to a live product (MERGE rows carry the live code)
# join_key_alt: "{style} {colour}"   # any reader: a second join_key, tried only where join_key finds no live
                               # product; may also use {style_alt} (sheet: columns: style_alt)
# hold: the store's codes and the OC's do not join yet   # parks the config: every path refuses it
# source_kind: SAP demand export   # the file is not the brand's own OC: a WARN names it
# oc_supplier: Example Brand Ltd   # ai: the company printed as the issuer on the brand's OCs (a list if it varies);
                               # a PDF from any other supplier is refused. Required for ai and fog; checked for
                               # otb and admilano when set
oc_label: EX                   # the label, for a reader that serves several: otb (the collection's first word,
                               # MM or MM6) and adidas (Y-3, Willy Chavarria, RS) require it; admilano checks its
                               # Brand field against it when set
# join_key: "{style} {colour_code}"  # how the store's manufacture_code is built from an OC line, from {style},
                               # {fabric}, {colour}, {colour_code}. Default (otb): "{style}{fabric} {colour}"
# colour_codes:                # {colour_code}: OC colour (any case) -> store colour code; an OC colour
#   GREY: GR                   # missing here stops the draft and is named
#   BLACK: BK
# size_map:                    # printed OC size -> the store's size, applied before sizes are matched to live
#   31x34: 31                  # variants (each a word or number). Without it a printed size keeps its own name
                               # unless the store holds the same size spelled differently: IT 42 = 42, OSFM = O/S
                               # = F = OS, S-M = S - M, from the live product or its live siblings, or a clear
                               # brand-wide majority (90% of the live products with that size, at least 10)
# heel_codes: true             # NEW titles write a heel height as the brand's H-code (Tabi Ballerina H30)
# colour_spelling: {Antracite: Anthracite}   # a cart colour word written the brand's way on NEW titles
                               # no season: the colleague picks the season of each order on the page (--season)
sku_prefix:                    # per season half, the letters before the picked season's two digits:
  S/S: EXSS                    # EXSS27001, EXSS27002, ... in an S/S 27 run, after the highest existing one
  F/W: EXFW                    # or per gender where the brand's SKUs differ, e.g. F/W: {MEN: EXMF, WOMEN: EXWF}
# sku_prefix_from:             # per half, where its prefix came from; new SKUs of a marked half are amber
#   S/S: "derived from live, check: ..."     # from the brand's live SKUs
#   F/W: "from the F/W 26 hand PO, not live, check: ..."   # no live SKU of that half to derive from
sku_digits: 3
cost_currency: EUR             # the OC's currency (an OC in any other is refused); Variant.cost_price is
                               # written as "<cost_currency> 123", e.g. "EUR 123" or "USD 123"
# title_tag: "{vendor} - {title} |MARAIS"   # only {vendor} {title}; body_html only {composition} {made_in} {code}
cost_multiplier: 1.0           # AUD Variant Cost = wholesale x this (season convention)
margin_floor: 2.5              # must match validator_core.margin_threshold for the vendor
default_gender: MEN            # for collections that carry no gender (e.g. jewellery)
history:                       # past season POs, newest first
  - {label: F/W 26, path: ~/path/to/Brand_FW26_PO.xlsx}
product_class_types:           # OC product class -> Type without gender (fallback only)
  SNEAKERS: SHOES SNEAKERS
  T-SHIRT: CLOTHING T-SHIRTS SHORT SLEEVE
colour_families:               # colour-name keyword -> Option1 Value (fallback only)
  BLACK: [black]
  WHITE: [white, off white, ivory]
country_names: {IT: Italy}
